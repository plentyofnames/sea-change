<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea Change</title>
<style>
  :root {
    --bg: #1a1a1d;
    --panel: #25252a;
    --card: #212126;
    --border: #3a3a42;
    --text: #e8e8ea;
    --muted: #9a9aa3;
    --faint: #6c6c75;
    --accent: #4f8cff;
    --accent-dim: #2a4880;
    --btn: #2f2f36;
    --btn-hover: #3a3a44;
    --error: #ff6b6b;
    --ok: #6bd49a;
    --warn: #e8b85a;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --l1: #6ea8ff;
    --l2: #6bd49a;
    --l3: #e8b85a;
    --l4: #e07ad8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header, section.controls, footer {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 0; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .sibling { margin-left: auto; color: var(--muted); font-size: 12px; text-decoration: none; }
  header .sibling:hover { color: var(--accent); }
  /* Tabs on the left, MIDI ports on the right of the same row, no taller than the tabs. */
  .tabbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; flex-basis: 100%; margin-top: 4px; }
  .tabs { display: flex; gap: 2px; align-self: flex-end; }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 8px 14px 9px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }

  .midi-io { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-left: auto; }
  .midi-io label {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .midi-io select { padding: 2px 4px; font-size: 12px; height: 24px; }
  #port, #inport { width: 170px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  select, input[type="search"], input[type="text"], .clear-btn, .btn {
    background: var(--btn);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  select:focus, input[type="search"]:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }
  #rom, #search { min-width: 220px; }
  .clear-btn, .btn { align-self: flex-end; padding: 6px 12px; cursor: pointer; }
  .clear-btn:hover, .btn:hover { background: var(--btn-hover); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--accent-dim); border-color: var(--accent-dim); }
  .btn.primary:hover { background: var(--accent); }

  /* ------------------------------ presets tab ------------------------------ */
  .banks {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 8px;
    margin-top: 14px;
  }
  @media (max-width: 900px) { .banks { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .bank-btn {
    background: var(--btn);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 10px 10px;
    text-align: left;
    cursor: pointer;
    min-height: 74px;
    transition: background 0.08s, border-color 0.08s, transform 0.04s;
  }
  .bank-btn:hover { background: var(--btn-hover); border-color: var(--accent-dim); }
  .bank-btn:active { transform: scale(0.97); }
  .bank-btn.selected { background: var(--accent); border-color: var(--accent); color: white; }
  .bank-btn .title { font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  .bank-btn .msb { font: 11px var(--mono); opacity: 0.7; font-weight: 400; }
  .bank-btn .cats {
    font: 11px var(--mono);
    opacity: 0.75;
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bank-btn.has-active::after {
    content: "●";
    float: right;
    font-size: 10px;
    margin-top: -14px;
    color: var(--ok);
  }
  .bank-btn.selected.has-active::after { color: white; }

  main.presets-main { padding: 14px 18px 18px; }
  .presets {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(16, auto);
    grid-auto-columns: minmax(0, 1fr);
    gap: 3px 4px;
  }
  @media (max-width: 1280px) { .presets { grid-template-rows: repeat(32, auto); } }
  @media (max-width: 640px)  { .presets { grid-template-rows: repeat(64, auto); } }
  .preset {
    display: flex;
    align-items: baseline;
    gap: 5px;
    background: var(--btn);
    color: var(--text);
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 6px 5px;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    min-width: 0;
    transition: background 0.06s, border-color 0.06s;
  }
  .preset:hover { background: var(--btn-hover); border-color: var(--accent-dim); }
  .preset:active { transform: scale(0.98); }
  .preset .num {
    font: 11px var(--mono);
    color: var(--muted);
    width: 2.2em;
    text-align: right;
    flex: none;
  }
  .preset .cat {
    font: 10px var(--mono);
    flex: none;
    width: 2.6em;
  }
  .preset .num.wide { width: 3.6em; }
  .preset .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preset.numonly { justify-content: center; font: 600 14px/1.2 var(--mono); }
  .preset.active { background: var(--accent); border-color: var(--accent); color: white; }
  .preset.active .num, .preset.active .cat { color: rgba(255,255,255,0.85) !important; }

  .results-summary { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  #results h2 {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 14px 0 6px;
  }
  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 3px 4px;
  }

  /* ------------------------------ editor tab ------------------------------- */
  .ed-bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .ed-name { display: flex; align-items: center; gap: 2px; font: 600 16px var(--mono); }
  .ed-name input {
    font: 600 16px var(--mono); background: #101013; color: #9fe0ff;
    border: 1px solid var(--border); border-radius: 5px; padding: 5px 7px;
  }
  .ed-name input:focus { outline: none; border-color: var(--accent); }
  #ed-cat { width: 3.4ch; text-align: center; box-sizing: content-box; }
  #ed-nm { width: 12.2ch; box-sizing: content-box; }
  .ed-name .colon { color: var(--muted); padding: 0 1px; }
  .ed-src { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); min-width: 0; }
  .ed-src b { color: var(--text); font-weight: 600; }
  .ed-src .live { color: var(--ok); }
  .ed-src .dirty { color: var(--warn); }
  .ed-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; align-items: center; }
  .ed-actions .btn { padding: 5px 10px; font-size: 12.5px; align-self: center; }
  .ed-actions .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

  .ed-banner {
    margin: 12px 18px 0; padding: 10px 12px; border-radius: 8px;
    background: #3a3220; border: 1px solid #6b5a2a; color: #f2dfb0; font-size: 13px;
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
  }
  .ed-banner .btn { padding: 4px 10px; font-size: 12.5px; align-self: center; }

  .ed-tabs { display: flex; gap: 6px; padding: 12px 18px 0; flex-wrap: wrap; }
  .ed-tab {
    background: var(--btn); color: var(--muted); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 12px; cursor: pointer; font-size: 13px;
    display: flex; align-items: baseline; gap: 7px; max-width: 280px; min-width: 0;
  }
  .ed-tab:hover { background: var(--btn-hover); color: var(--text); }
  .ed-tab.on { color: var(--text); border-color: var(--accent); background: #26314a; }
  .ed-tab .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; align-self: center; }
  .ed-tab .ins { font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ed-tab.mute { opacity: 0.55; }
  .ed-tab.mute .ins { text-decoration: line-through; }

  /* Masonry: cards flow down columns; wide cards span them all. */
  .ed-page { padding: 12px 18px 18px; columns: 340px; column-gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px 12px; min-width: 0;
    break-inside: avoid; margin-bottom: 12px; display: flow-root;
  }
  .card.wide { column-span: all; }
  .card h3 {
    margin: 0 0 8px; font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 8px; min-height: 22px;
  }
  .card h3 .spacer { flex: 1; }
  .card h3 select, .card h3 .toggle { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .card h3 select { padding: 2px 6px; font-size: 12px; }
  .card h4 { margin: 12px 0 5px; font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .card h4:first-of-type { margin-top: 0; }
  .card .note { font-size: 12px; color: var(--faint); margin: 0 0 6px; }
  .cells { display: flex; flex-wrap: wrap; gap: 8px 12px; }
  .cell { display: flex; flex-direction: column; gap: 2px; flex: 1 1 108px; min-width: 96px; max-width: 220px; }
  .cell.w2 { flex-basis: 220px; max-width: none; }
  .cell.full { flex-basis: 100%; max-width: none; }
  .cells.q4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cells.q4 .cell { min-width: 0; max-width: none; }
  .cell .lab { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .cell .lab .v { font: 11.5px var(--mono); color: var(--text); cursor: text; overflow: hidden; text-overflow: ellipsis; }
  .cell .lab .v:hover { color: var(--accent); }
  .vedit { width: 5.5em; font: 11.5px var(--mono); background: #101013; color: var(--text); border: 1px solid var(--accent); border-radius: 3px; padding: 0 3px; }
  .cell select { width: 100%; padding: 4px 6px; font-size: 12.5px; }
  .cell.dim, .cord.dim { opacity: 0.42; }
  input[type="range"] { width: 100%; margin: 2px 0; accent-color: var(--accent); height: 16px; }
  .toggle {
    background: var(--btn); color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 12.5px; cursor: pointer; text-align: left;
  }
  .toggle.on { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }

  .cords { display: block; }
  .cord { display: grid; grid-template-columns: 1.8em minmax(0, 1fr) minmax(0, 1fr) minmax(80px, 0.9fr) 3.2em; gap: 6px; align-items: center; }
  .cord .i { font: 11px var(--mono); color: var(--faint); text-align: right; }
  .cord select { padding: 3px 5px; font-size: 12px; min-width: 0; width: 100%; }
  .cord .v { font: 11.5px var(--mono); text-align: right; cursor: text; }
  .cord-head { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .cords-more { margin-top: 6px; }

  svg text { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  .zones { width: 100%; height: auto; display: block; }
  .zones .row-hit { cursor: pointer; }
  .zones .row-hit:hover .bg { fill: #2c2c33; }
  .env-svg { width: 100%; height: 86px; display: block; background: #18181c; border-radius: 6px; margin: 2px 0 6px; }
  .env-grid { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); gap: 6px 18px; align-items: start; }
  @media (max-width: 820px) { .env-grid { grid-template-columns: minmax(0, 1fr); } }
  .env-stages { display: flex; flex-wrap: wrap; gap: 8px 12px; }
  .env-stage { flex: 1 1 92px; min-width: 88px; display: flex; flex-direction: column; gap: 2px; }
  .env-stage .cell { min-width: 0; max-width: none; flex: none; }

  .kbd-bar {
    position: sticky; bottom: 34px; z-index: 4;
    display: flex; align-items: center; gap: 12px; padding: 8px 18px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  .kbd-bar .ctl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); flex: none; }
  .kbd-bar .btn { padding: 3px 8px; font-size: 12px; align-self: center; }
  .kbd-bar input[type="range"] { width: 80px; }
  #kb-oct, #kb-vel-v { font: 12px var(--mono); color: var(--text); min-width: 2.2em; text-align: center; }
  .keys { position: relative; height: 50px; flex: 1; min-width: 0; user-select: none; touch-action: none; }
  .key { position: absolute; top: 0; border: 1px solid #111; border-radius: 0 0 4px 4px; }
  .key.w { background: #e9e9ec; height: 100%; z-index: 1; }
  .key.b { background: #16161a; height: 60%; z-index: 2; }
  .key.down.w { background: #9cc0ff; }
  .key.down.b { background: var(--accent); }
  .key .lbl { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font: 9px var(--mono); color: #777; }
  @media (max-width: 640px) { .kbd-bar .ctl:nth-child(2) { display: none; } }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; min-width: 320px; max-width: 92vw;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
  dialog h2 { margin: 0 0 10px; font-size: 15px; }
  dialog p { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  dialog .row { margin-bottom: 14px; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
  #wr-num { min-width: 240px; }

  footer {
    border-top: 1px solid var(--border);
    border-bottom: none;
    font: 12px/1.4 var(--mono);
    color: var(--muted);
    position: sticky;
    bottom: 0;
    z-index: 6;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  footer .status.ok { color: var(--ok); }
  footer .status.err { color: var(--error); }
</style>
</head>
<body>
  <header>
    <h1>Sea Change</h1>
    <span class="sub">E-MU Proteus 2000 preset selector &amp; editor · Web MIDI</span>
    <a class="sibling" href="../small-change/index.html">Any other synth? Small Change →</a>
    <div class="tabbar">
      <nav class="tabs" role="tablist">
        <button class="tab on" role="tab" data-view="presets">Presets</button>
        <button class="tab" role="tab" data-view="editor">Editor</button>
      </nav>
      <div class="midi-io">
        <label title="MIDI output, to the P2K's MIDI In">Out
          <select id="port"><option value="">— No MIDI access —</option></select></label>
        <label title="MIDI channel">Ch
          <select id="channel"></select></label>
        <label title="MIDI input, from the P2K's MIDI Out. Only the editor needs it.">In
          <select id="inport"><option value="">— No MIDI access —</option></select></label>
        <label title="The P2K's MIDI SysEx ID (Master menu, default 0). Only the editor uses it.">ID
          <select id="devid"></select></label>
      </div>
    </div>
  </header>

  <div id="view-presets">
    <section class="controls">
      <div class="row">
        <div class="field">
          <label for="rom">ROM</label>
          <select id="rom"></select>
        </div>
        <div class="field">
          <label for="search">Search all ROMs</label>
          <input type="search" id="search" placeholder="name or category, e.g. moog, pad dream" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="type">Type</label>
          <select id="type"><option value="">All types</option></select>
        </div>
        <button id="clear" class="clear-btn" hidden>Clear</button>
        <button id="read-names" class="btn" hidden title="Read the user preset names from the unit over SysEx">Read names from P2K</button>
      </div>
      <div id="banks" class="banks"></div>
    </section>

    <main class="presets-main">
      <div id="presets" class="presets"></div>
      <div id="results" hidden></div>
    </main>
  </div>

  <div id="view-editor" hidden>
    <section class="ed-bar">
      <div class="ed-name" title="Preset name: a 3-letter category, a colon, and up to 12 characters">
        <input id="ed-cat" maxlength="3" spellcheck="false" autocomplete="off" aria-label="Category">
        <span class="colon">:</span>
        <input id="ed-nm" maxlength="12" spellcheck="false" autocomplete="off" aria-label="Name">
      </div>
      <div class="ed-src" id="ed-src"></div>
      <div class="ed-actions">
        <button class="btn primary" id="ed-get" title="Read the selected channel's preset (edit buffer) from the P2K">Get from P2K</button>
        <button class="btn" id="ed-send" title="Send this preset to the P2K's edit buffer (not stored)">Send</button>
        <button class="btn" id="ed-write" title="Store this preset in a user location on the P2K">Write…</button>
        <span class="sep"></span>
        <button class="btn" id="ed-undo" title="Undo (⌘Z)">Undo</button>
        <button class="btn" id="ed-redo" title="Redo (⇧⌘Z)">Redo</button>
        <button class="btn" id="ed-revert" title="Back to the preset as it was loaded">Revert</button>
        <span class="sep"></span>
        <button class="btn" id="ed-open" title="Open a preset .syx file">Open…</button>
        <button class="btn" id="ed-save" title="Save this preset as a .syx file">Save .syx</button>
        <button class="btn" id="ed-init" title="Start from E-MU's default preset">Init</button>
        <input type="file" id="ed-file" accept=".syx,application/octet-stream" hidden>
      </div>
    </section>
    <div id="ed-banner" class="ed-banner" hidden></div>
    <nav class="ed-tabs" id="ed-tabs"></nav>
    <div id="ed-page" class="ed-page"></div>
    <section class="kbd-bar">
      <div class="ctl">
        <button class="btn" id="kb-down" title="Octave down">◀</button>
        <span id="kb-oct">C2</span>
        <button class="btn" id="kb-up" title="Octave up">▶</button>
      </div>
      <div class="ctl"><label for="kb-vel">Vel</label><input type="range" id="kb-vel" min="1" max="127" value="100"><span id="kb-vel-v">100</span></div>
      <div class="keys" id="keys" title="Play with the mouse, or with the computer keyboard (Z–M and Q–U rows)"></div>
      <button class="btn" id="kb-panic" title="All notes off">Panic</button>
    </section>
  </div>

  <dialog id="write-dlg">
    <h2>Write preset to the P2K</h2>
    <p>Stores the preset in a user location, replacing what is there.</p>
    <div class="row">
      <div class="field">
        <label for="wr-bank">User bank</label>
        <select id="wr-bank"><option value="0">Bank 0</option><option value="1">Bank 1</option><option value="2">Bank 2</option><option value="3">Bank 3</option></select>
      </div>
      <div class="field">
        <label for="wr-num">Location</label>
        <select id="wr-num"></select>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="wr-names" title="Read the user preset names from the unit">Read names</button>
      <span style="flex:1"></span>
      <button class="btn" id="wr-cancel">Cancel</button>
      <button class="btn primary" id="wr-ok">Write</button>
    </div>
  </dialog>

  <dialog id="pick-dlg">
    <h2>Choose a preset</h2>
    <p id="pick-info"></p>
    <div class="row"><select id="pick-list" size="12" style="width:100%"></select></div>
    <div class="actions">
      <button class="btn" id="pick-cancel">Cancel</button>
      <button class="btn primary" id="pick-ok">Open</button>
    </div>
  </dialog>

  <footer>
    <span id="status" class="status">Requesting MIDI access…</span>
  </footer>

<script src="p2k-roms.js"></script>
<script src="p2k-data.js"></script>
<script src="p2k-core.js"></script>
<script src="sim.js"></script>
<script src="midi.js"></script>
<script src="presets.js"></script>
<script src="editor.js"></script>
<script>
"use strict";
// Tabs. The editor asks for SysEx access the first time it's shown.
(() => {
  const views = { presets: document.getElementById("view-presets"), editor: document.getElementById("view-editor") };
  const tabs = document.querySelectorAll(".tab");
  function show(name) {
    for (const [k, el] of Object.entries(views)) el.hidden = k !== name;
    tabs.forEach((t) => t.classList.toggle("on", t.dataset.view === name));
    const hash = name === "editor" ? "#editor" : "";
    if (location.hash !== hash) history.replaceState(null, "", location.pathname + location.search + hash);
    if (name === "editor") Editor.shown();
  }
  tabs.forEach((t) => t.addEventListener("click", () => show(t.dataset.view)));
  document.addEventListener("p2k:edit-request", () => { show("editor"); Editor.getFromUnit(); });
  Midi.init().then(() => show(location.hash === "#editor" ? "editor" : "presets"));
})();
</script>
</body>
</html>
