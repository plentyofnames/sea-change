<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea Change</title>
<style>
  :root {
    --bg: #1a1a1d;
    --panel: #25252a;
    --border: #3a3a42;
    --text: #e8e8ea;
    --muted: #9a9aa3;
    --accent: #4f8cff;
    --accent-dim: #2a4880;
    --btn: #2f2f36;
    --btn-hover: #3a3a44;
    --error: #ff6b6b;
    --ok: #6bd49a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header, section.controls, footer {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header { display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .sibling { margin-left: auto; color: var(--muted); font-size: 12px; text-decoration: none; }
  header .sibling:hover { color: var(--accent); }

  .row { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  select, input[type="search"], .clear-btn {
    background: var(--btn);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  select:focus, input[type="search"]:focus { outline: none; border-color: var(--accent); }
  #port, #rom, #search { min-width: 220px; }
  .clear-btn { align-self: flex-end; padding: 6px 12px; cursor: pointer; }
  .clear-btn:hover { background: var(--btn-hover); }

  .banks {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 8px;
    margin-top: 14px;
  }
  @media (max-width: 900px) { .banks { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .bank-btn {
    background: var(--btn);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 10px 10px;
    text-align: left;
    cursor: pointer;
    min-height: 74px;
    transition: background 0.08s, border-color 0.08s, transform 0.04s;
  }
  .bank-btn:hover { background: var(--btn-hover); border-color: var(--accent-dim); }
  .bank-btn:active { transform: scale(0.97); }
  .bank-btn.selected { background: var(--accent); border-color: var(--accent); color: white; }
  .bank-btn .title { font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  .bank-btn .msb { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; opacity: 0.7; font-weight: 400; }
  .bank-btn .cats {
    font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    opacity: 0.75;
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bank-btn.has-active::after {
    content: "●";
    float: right;
    font-size: 10px;
    margin-top: -14px;
    color: var(--ok);
  }
  .bank-btn.selected.has-active::after { color: white; }

  main { padding: 14px 18px 18px; }
  .presets {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(16, auto);
    grid-auto-columns: minmax(0, 1fr);
    gap: 3px 4px;
  }
  @media (max-width: 1280px) { .presets { grid-template-rows: repeat(32, auto); } }
  @media (max-width: 640px)  { .presets { grid-template-rows: repeat(64, auto); } }
  .preset {
    display: flex;
    align-items: baseline;
    gap: 5px;
    background: var(--btn);
    color: var(--text);
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 6px 5px;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    min-width: 0;
    transition: background 0.06s, border-color 0.06s;
  }
  .preset:hover { background: var(--btn-hover); border-color: var(--accent-dim); }
  .preset:active { transform: scale(0.98); }
  .preset .num {
    font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    width: 2.2em;
    text-align: right;
    flex: none;
  }
  .preset .cat {
    font: 10px ui-monospace, SFMono-Regular, Menlo, monospace;
    flex: none;
    width: 2.6em;
  }
  .preset .num.wide { width: 3.6em; }
  .preset .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preset.numonly { justify-content: center; font: 600 14px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .preset.active { background: var(--accent); border-color: var(--accent); color: white; }
  .preset.active .num, .preset.active .cat { color: rgba(255,255,255,0.85) !important; }

  .results-summary { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  #results h2 {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 14px 0 6px;
  }
  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 3px 4px;
  }

  footer {
    border-top: 1px solid var(--border);
    border-bottom: none;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    position: sticky;
    bottom: 0;
  }
  footer .status.ok { color: var(--ok); }
  footer .status.err { color: var(--error); }
</style>
</head>
<body>
  <header>
    <h1>Sea Change</h1>
    <span class="sub">E-MU Proteus 2000 preset selector · Web MIDI</span>
    <a class="sibling" href="../small-change/index.html">Any other synth? Small Change →</a>
  </header>

  <section class="controls">
    <div class="row">
      <div class="field">
        <label for="port">MIDI Output</label>
        <select id="port"><option value="">— No MIDI access —</option></select>
      </div>
      <div class="field">
        <label for="channel">Channel</label>
        <select id="channel"></select>
      </div>
      <div class="field">
        <label for="rom">ROM</label>
        <select id="rom"></select>
      </div>
      <div class="field">
        <label for="search">Search all ROMs</label>
        <input type="search" id="search" placeholder="name or category, e.g. moog, pad dream" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="type">Type</label>
        <select id="type"><option value="">All types</option></select>
      </div>
      <button id="clear" class="clear-btn" hidden>Clear</button>
    </div>
    <div id="banks" class="banks"></div>
  </section>

  <main>
    <div id="presets" class="presets"></div>
    <div id="results" hidden></div>
  </main>

  <footer>
    <span id="status" class="status">Requesting MIDI access…</span>
  </footer>

    { label: 'Tempo-synced',        codes: ['bpm', 'clk'] },
    { label: 'Strings & Orchestra', codes: ['str', 'orc'] },
    { label: 'Brass & Wind',        codes: ['brs', 'wnd'] },
    { label: 'Guitar',              codes: ['gtr', 'git'] },
    { label: 'Vocals',              codes: ['vox'] },
    { label: 'Hits',                codes: ['hit'] },
    { label: 'Beats',               codes: ['bts'] },
    { label: 'Drum kits',           codes: ['kit'] },
    { label: 'Percussion',          codes: ['prc', 'pr1', 'pr2', 'pr3'] },
    { label: 'Single drums',        codes: ['bd1', 'bd2', 'sn1', 'sn2', 'sn3', 'sn4', 'sn5', 'sn6', 'sn7', 'hh1', 'cb1', 'cb2', 'clp', 'tom'] },
    { label: 'FX, Noise & Scratch', codes: ['sfx', 'nse', 'scr'] },
  ];

  let midiAccess = null;
  let romIdx = 0;
  let bankIdx = 0;
  let active = null; // { rom, bank, pc } of the last preset sent

  function splitPreset(s) {
    const i = s.indexOf(':');
    return { cat: s.slice(0, i), name: s.slice(i + 1) };
  }

  const INDEX = [];
  ROMS.forEach((rom, r) => {
    if (rom.user) return;
    rom.banks.forEach((bank, b) => bank.forEach((p, pc) => {
      const { cat, name } = splitPreset(p);
      INDEX.push({ r, b, pc, cat, hay: (cat + ' ' + name).toLowerCase() });
    }));
  });

  const grouped = new Set(TYPES.flatMap(t => t.codes));
  const otherCodes = [...new Set(INDEX.map(e => e.cat))].filter(c => !grouped.has(c));
  if (otherCodes.length) TYPES.push({ label: 'Other', codes: otherCodes });

  for (let i = 1; i <= 16; i++) {
    const opt = document.createElement('option');
    opt.value = String(i - 1);
    opt.textContent = String(i);
    $channel.appendChild(opt);
  }

  ROMS.forEach((rom, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = rom.user
      ? 'User banks (MSB 0)'
      : rom.name + ' — ' + rom.id + ' (MSB ' + rom.msb + ')';
    $rom.appendChild(opt);
  });

  TYPES.forEach((t, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = t.label + ' (' + INDEX.filter(e => t.codes.includes(e.cat)).length + ')';
    opt.title = t.codes.map(c => c || '(none)').join(' ');
    $type.appendChild(opt);
  });

  function setStatus(msg, kind = '') {
    $status.textContent = msg;
    $status.className = 'status' + (kind ? ' ' + kind : '');
  }

  // Numbered variants (bs1…bs5, kb1…kb4) share a hue.
  function catColor(cat) {
    const key = cat.replace(/\d+$/, '');
    let h = 0;
    for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return 'hsl(' + h + ', 55%, 68%)';
  }

  function bankCategories(bank) {
    const seen = [];
    for (const p of bank) {
      const c = splitPreset(p).cat;
      if (c && !seen.includes(c)) seen.push(c);
    }
    return seen;
  }

  function isActive(r, b, pc) {
    return active && active.rom === r && active.bank === b && (pc === undefined || active.pc === pc);
  }

  function isSearching() {
    return $search.value.trim() !== '' || $type.value !== '';
  }

  function render() {
    renderBanks();
    const searching = isSearching();
    $presets.hidden = searching;
    $results.hidden = !searching;
    $clear.hidden = !searching;
    if (searching) renderResults(); else renderPresets();
  }

  function clearSearch() {
    $search.value = '';
    $type.value = '';
    render();
  }

  function renderBanks() {
    const rom = ROMS[romIdx];
    $banks.innerHTML = '';
    rom.banks.forEach((bank, b) => {
      const btn = document.createElement('button');
      btn.className = 'bank-btn' + (b === bankIdx ? ' selected' : '') + (isActive(romIdx, b) ? ' has-active' : '');

      const title = document.createElement('div');
      title.className = 'title';
      title.append('Bank ' + b);
      const msb = document.createElement('span');
      msb.className = 'msb';
      msb.textContent = rom.msb + '/' + b;
      title.appendChild(msb);

      const cats = document.createElement('div');
      cats.className = 'cats';
      if (rom.user) {
        cats.textContent = 'user · ' + (b * 128) + '–' + (b * 128 + 127);
      } else {
        const list = bankCategories(bank);
        cats.textContent = list.slice(0, 6).join(' · ') + (list.length > 6 ? ' …' : '');
        cats.title = list.join(' · ');
      }

      btn.append(title, cats);
      btn.addEventListener('click', () => { bankIdx = b; clearSearch(); });
      $banks.appendChild(btn);
    });
  }

  function presetButton(r, b, pc, numText) {
    const rom = ROMS[r];
    const btn = document.createElement('button');
    btn.className = 'preset' + (isActive(r, b, pc) ? ' active' : '');
    btn.addEventListener('click', () => sendPreset(r, b, pc));

    if (rom.user) {
      btn.classList.add('numonly');
      btn.textContent = String(pc);
      btn.title = 'User bank ' + b + ' #' + pc;
      return btn;
    }

    const { cat, name } = splitPreset(rom.banks[b][pc]);
    btn.title = rom.id + ' bank ' + b + ' #' + pc + '  ' + cat + ':' + name;
    const num = document.createElement('span');
    num.className = 'num' + (numText.length > 3 ? ' wide' : '');
    num.textContent = numText;
    const c = document.createElement('span');
    c.className = 'cat';
    c.textContent = cat;
    c.style.color = catColor(cat);
    const n = document.createElement('span');
    n.className = 'name';
    n.textContent = name;
    btn.append(num, c, n);
    return btn;
  }

  function renderPresets() {
    $presets.innerHTML = '';
    for (let pc = 0; pc < 128; pc++) {
      $presets.appendChild(presetButton(romIdx, bankIdx, pc, String(pc)));
    }
  }

  function renderResults() {
    const tokens = $search.value.toLowerCase().split(/\s+/).filter(Boolean);
    const type = $type.value === '' ? null : TYPES[parseInt($type.value, 10)];
    const hits = INDEX.filter(e =>
      (!type || type.codes.includes(e.cat)) && tokens.every(t => e.hay.includes(t)));

    const perRom = new Map();
    for (const e of hits) perRom.set(e.r, (perRom.get(e.r) || 0) + 1);

    $results.innerHTML = '';
    const summary = document.createElement('div');
    summary.className = 'results-summary';
    summary.textContent = hits.length
      ? hits.length + (hits.length === 1 ? ' match' : ' matches') + ' · click to send · Esc to clear'
      : 'No presets match.';
    $results.appendChild(summary);

    let grid = null;
    let lastRom = -1;
    for (const e of hits) {
      if (e.r !== lastRom) {
        lastRom = e.r;
        const h = document.createElement('h2');
        h.textContent = ROMS[e.r].name + ' · ' + ROMS[e.r].id + ' · ' + perRom.get(e.r);
        grid = document.createElement('div');
        grid.className = 'result-grid';
        $results.append(h, grid);
      }
      grid.appendChild(presetButton(e.r, e.b, e.pc, e.b + '·' + e.pc));
    }
  }

  // localStorage is shared by every app on the origin, hence the prefixed key.
  const STORE_KEY = 'sea-change:settings';
  const saved = (() => {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
  })();
  // The output the user last picked. Port ids can change between sessions, so the name is the fallback.
  let preferredPort = saved.port || null;

  function saveSettings() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        port: preferredPort,
        channel: parseInt($channel.value, 10),
      }));
    } catch { /* storage unavailable: settings just aren't remembered */ }
  }

  // Returns true if the preferred output is connected (and now selected).
  function refreshPorts() {
    if (!midiAccess) return false;
    const prev = $port.value;
    $port.innerHTML = '';
    const outs = [...midiAccess.outputs.values()];
    if (outs.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '— No MIDI outputs found —';
      $port.appendChild(opt);
      return false;
    }
    for (const out of outs) {
      const opt = document.createElement('option');
      opt.value = out.id;
      opt.textContent = out.name + (out.manufacturer ? ' (' + out.manufacturer + ')' : '');
      $port.appendChild(opt);
    }
    const preferred = preferredPort &&
      (outs.find(o => o.id === preferredPort.id) || outs.find(o => o.name === preferredPort.name));
    const pick = preferred || outs.find(o => o.id === prev);
    if (pick) $port.value = pick.id;
    return !!preferred;
  }

  function selectedOutputName() {
    const out = midiAccess && midiAccess.outputs.get($port.value);
    return out ? out.name : '—';
  }

  function sendPreset(r, b, pc) {
    const portId = $port.value;
    if (!portId) { setStatus('No MIDI output selected', 'err'); return; }
    const out = midiAccess && midiAccess.outputs.get(portId);
    if (!out) { setStatus('Selected MIDI output unavailable', 'err'); return; }

    const rom = ROMS[r];
    const ch = parseInt($channel.value, 10) & 0x0f;
    try {
      out.send([0xB0 | ch,  0, rom.msb]); // CC 0  — Bank Select MSB (ROM ID, 0 = User)
      out.send([0xB0 | ch, 32, b]);       // CC 32 — Bank Select LSB (bank in ROM)
      out.send([0xC0 | ch, pc]);          // Program Change
    } catch (e) {
      setStatus('Send failed: ' + e.message, 'err');
      return;
    }

    // Follow the sent preset so the bank view shows where it lives.
    active = { rom: r, bank: b, pc };
    romIdx = r;
    bankIdx = b;
    $rom.value = String(r);
    render();

    const label = rom.user ? '' : ' ' + rom.banks[b][pc];
    setStatus(rom.id + ' bank ' + b + ' #' + pc + label +
      ' (MSB ' + rom.msb + ', LSB ' + b + ', PC ' + pc + ') ch ' + (ch + 1) + ' → ' + out.name, 'ok');
  }

  $rom.addEventListener('change', () => {
    romIdx = parseInt($rom.value, 10);
    bankIdx = Math.min(bankIdx, ROMS[romIdx].banks.length - 1);
    clearSearch();
  });
  $search.addEventListener('input', render);
  $type.addEventListener('change', render);
  $clear.addEventListener('click', clearSearch);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && isSearching()) { e.preventDefault(); clearSearch(); }
  });
  $port.addEventListener('change', () => {
    const out = midiAccess && midiAccess.outputs.get($port.value);
    preferredPort = out ? { id: out.id, name: out.name } : null;
    saveSettings();
  });
  $channel.addEventListener('change', saveSettings);

  $channel.value = String(Math.max(0, Math.min(15, saved.channel | 0)));
  render();

  if (!navigator.requestMIDIAccess) {
    setStatus('Web MIDI not supported in this browser. Use Chrome, Edge, Opera or Firefox 108+ (Safari has no Web MIDI).', 'err');
    return;
  }

  navigator.requestMIDIAccess({ sysex: false }).then(access => {
    midiAccess = access;
    const foundPreferred = refreshPorts();
    access.onstatechange = () => {
      refreshPorts();
      setStatus('MIDI ports updated. Output: ' + selectedOutputName());
    };
    if (access.outputs.size === 0) {
      setStatus('MIDI ready, but no outputs are connected.', 'err');
    } else if (preferredPort && !foundPreferred) {
      setStatus('Saved output "' + preferredPort.name + '" is not connected. Using ' + selectedOutputName() + ' for now.', 'err');
    } else {
      setStatus('Ready. Output: ' + selectedOutputName(), 'ok');
    }
  }).catch(err => {
    setStatus('MIDI access denied: ' + err.message, 'err');
  });
})();
</script>
</body>
</html>
